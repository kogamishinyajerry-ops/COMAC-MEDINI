name: Repository acceptance

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-checkout:
    name: ${{ matrix.project }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: [medini-agent-automation, native-safety-analysis]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned test runner and optional integration deps
        run: |
          python -m pip install pytest==8.4.2
          if [ "${{ matrix.project }}" = "medini-agent-automation" ]; then
            # integrations/dsh 需要 mcp 与 PyYAML（pyproject 的 dsh extra）。
            # 缺 mcp：MCP 冒烟测试 ImportError 失败，看起来像代码坏了。
            # 缺 PyYAML：patch_dsh 的 yaml 复验静默降级为 skip，不会有任何红灯。
            python -m pip install "mcp==1.16.0" "PyYAML==6.0.3"
          fi
      - name: Record environment
        run: |
          git rev-parse HEAD
          python --version
          python -m pytest --version
      - name: Compile tracked source
        run: python -m compileall -q src
      - name: Import A line entry points
        if: ${{ !cancelled() && matrix.project == 'medini-agent-automation' }}
        run: python -c "import medini_automation.cli; import medini_automation.application.agent_api"
      - name: Import B line entry point
        if: ${{ !cancelled() && matrix.project == 'native-safety-analysis' }}
        run: python -c "import native_safety.cli.main"
      - name: Run new writer safety regressions explicitly
        if: ${{ !cancelled() && matrix.project == 'medini-agent-automation' }}
        run: python -m pytest tests/unit/test_acceptance_writer_lock.py -q
      - name: Run A line non-Medini tests
        if: ${{ !cancelled() && matrix.project == 'medini-agent-automation' }}
        run: python -m pytest tests -q -m 'not real_medini'
      - name: Run B line tests
        if: ${{ !cancelled() && matrix.project == 'native-safety-analysis' }}
        run: python -m pytest tests -q
      - name: Run B independent verification programs
        if: ${{ !cancelled() && matrix.project == 'native-safety-analysis' }}
        run: |
          status=0
          for file in verification/run_cross_check.py verification/run_rate_cross_check.py verification/run_importance_cross_check.py verification/run_store_verification.py verification/run_fmea_verification.py; do
            python "$file" || status=1
          done
          exit "$status"
